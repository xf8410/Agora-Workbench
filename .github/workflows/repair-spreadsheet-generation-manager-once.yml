name: Repair spreadsheet branch GenerationManager once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-spreadsheet-generation-manager-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'workbench/spreadsheet-attachments-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/spreadsheet-attachments-20260807
          fetch-depth: 0
      - name: Restore exactly one damaged source file and remove this workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          test "$(cat app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt)" != "PLACEHOLDER"
          git rm .github/workflows/repair-spreadsheet-generation-manager-once.yml
          git config user.name 'Agora Workbench Repair'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          git commit -m 'repair: restore GenerationManager from main'
          git push origin HEAD:workbench/spreadsheet-attachments-20260807
