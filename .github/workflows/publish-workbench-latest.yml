name: Publish Workbench Latest Release (legacy manual fallback)

# Rolling release publication now happens in build-workbench.yml in the same job that
# builds and verifies the signed APK. Keeping workflow_run publication here caused two
# independent publishers to race, and skipped runs left Releases behind Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Legacy fallback only: successful Build Agora Workbench APK run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Explain migration
        run: |
          echo "Automatic rolling publication moved to .github/workflows/build-workbench.yml."
          echo "Requested legacy run: ${{ inputs.run_id }}"
          echo "Re-run the main Build Agora Workbench APK workflow to rebuild and publish Releases directly."
