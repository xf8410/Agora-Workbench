name: Restore CI diagnostic file once

on:
  push:
    branches:
      - workbench/uma-session-batched-upload-progress-20260811
    paths:
      - .github/workflows/restore-ci-failure-summary-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/uma-session-batched-upload-progress-20260811
          fetch-depth: 0
      - name: Restore exact main copy and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- ci-failure-summary.txt
          git rm .github/workflows/restore-ci-failure-summary-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-failure-summary.txt
          git commit -m "恢复CI诊断文件到main版本 [skip ci]"
          git push origin HEAD:workbench/uma-session-batched-upload-progress-20260811
