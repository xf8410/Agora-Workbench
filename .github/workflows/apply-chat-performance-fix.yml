name: One-shot remove migrated legacy patch workflows

# All useful runtime pieces were audited against normal source before this deletion:
# chat performance, GitHub login, workspace artifacts, Uma wiring, and broad reader are
# already present. Missing GitHub mutations are being ported as reviewed Kotlin source.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/root-fix-release-tools-phase1
          fetch-depth: 0
      - name: Delete all legacy source patchers, including this one
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-chat-performance-fix.yml \
            .github/workflows/github-ai-tools.yml \
            .github/workflows/github-login.yml \
            .github/workflows/github-write-confirm.yml \
            .github/workflows/github-confirm-memory-sync.yml \
            .github/workflows/workspace-artifacts.yml \
            .github/workflows/apply-uma-workbench-integration.yml \
            .github/workflows/merge-uma-broad-reader.yml \
            .github/workflows/apply-github-create-repository-tool.yml
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'ci: remove migrated legacy source patch workflows'
          git push origin HEAD:workbench/root-fix-release-tools-phase1
