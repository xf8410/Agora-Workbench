name: Apply chat history performance fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Patch chat loading and large JSON rendering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f"marker mismatch in {path}: {old[:120]!r}")
              if s.count(old) != 1:
                  raise SystemExit(f"non-unique marker in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new))

          db = 'app/src/main/java/com/newoether/agora/data/local/ChatDatabase.kt'
          one(db,
              '@Entity(\n    tableName = "messages",\n    indices = [Index(value = ["conversationId"])],',
              '@Entity(\n    tableName = "messages",\n    indices = [\n        Index(value = ["conversationId"]),\n        Index(value = ["conversationId", "timestamp"]),\n    ],')
          one(db,
              '    @Query("SELECT COUNT(*) FROM messages WHERE conversationId = :conversationId")\n    fun getMessageCountForConversation(conversationId: String): Flow<Int>\n',
              '''    @Query("SELECT COUNT(*) FROM messages WHERE conversationId = :conversationId")
    fun getMessageCountForConversation(conversationId: String): Flow<Int>

    /** Marks abandoned generation rows without loading large message bodies into memory. */
    @Query("""
        UPDATE messages SET status = 'STOPPED'
        WHERE conversationId = :conversationId
          AND status IN ('SENDING', 'THINKING', 'TOOL_CALLING', 'TRANSCRIBING')
    """)
    suspend fun stopStuckMessages(conversationId: String)
''')
          one(db, '        const val CURRENT_VERSION = 15', '        const val CURRENT_VERSION = 16')
          one(db,
              '''            object : Migration(14, 15) {
                override fun migrate(db: SupportSQLiteDatabase) {
                    db.execSQL("ALTER TABLE conversations ADD COLUMN draftText TEXT NOT NULL DEFAULT ''")
                    db.execSQL("ALTER TABLE conversations ADD COLUMN draftAttachments TEXT")
                }
            }
''',
              '''            object : Migration(14, 15) {
                override fun migrate(db: SupportSQLiteDatabase) {
                    db.execSQL("ALTER TABLE conversations ADD COLUMN draftText TEXT NOT NULL DEFAULT ''")
                    db.execSQL("ALTER TABLE conversations ADD COLUMN draftAttachments TEXT")
                }
            },
            // v15 → v16 covers the hot history query: conversation + newest timestamp window.
            object : Migration(15, 16) {
                override fun migrate(db: SupportSQLiteDatabase) {
                    db.execSQL("CREATE INDEX IF NOT EXISTS index_messages_conversationId_timestamp ON messages (conversationId, timestamp)")
                }
            }
''')

          repo = 'app/src/main/java/com/newoether/agora/data/repository/ConversationRepository.kt'
          one(repo,
              '''    suspend fun fixStuckMessages(conversationId: String) {
        val stuckMessages = chatDao.getMessagesForConversation(conversationId).first()
            .filter {
                it.status == MessageStatus.SENDING ||
                it.status == MessageStatus.THINKING ||
                it.status == MessageStatus.TOOL_CALLING ||
                it.status == MessageStatus.TRANSCRIBING
            }
        stuckMessages.forEach { msg ->
            chatDao.upsertMessage(msg.copy(status = MessageStatus.STOPPED))
        }
    }
''',
              '''    suspend fun fixStuckMessages(conversationId: String) {
        chatDao.stopStuckMessages(conversationId)
    }
''')

          vm = 'app/src/main/java/com/newoether/agora/viewmodel/ChatViewModel.kt'
          one(vm,
              '''        private const val INITIAL_MESSAGE_WINDOW = 100
        private const val MESSAGE_WINDOW_STEP = 100
''',
              '''        // Keep cold-open work bounded by rendered content, not the whole conversation.
        private const val INITIAL_MESSAGE_WINDOW = 40
        private const val MESSAGE_WINDOW_STEP = 40
''')
          one(vm,
              '''                        if (!state.generating.value) {
                            val stuckMessages = convRepo.getMessagesForConversation(id).first()
                                .filter { it.status == MessageStatus.SENDING || it.status == MessageStatus.THINKING || it.status == MessageStatus.TOOL_CALLING || it.status == MessageStatus.TRANSCRIBING }

                            stuckMessages.forEach { msg ->
                                convRepo.upsertMessage(msg.copy(status = MessageStatus.STOPPED))
                            }
                        }
''',
              '''                        if (!state.generating.value) {
                            // SQL UPDATE only: do not materialize large text/tool JSON just to fix statuses.
                            convRepo.fixStuckMessages(id)
                        }
''')
          old_map = '''                            val mapped = entities.map {
                                ChatMessage(
                                    id = it.id,
                                    parentId = it.parentId,
                                    text = SearchResultFormatter.format(it.text, appContext),
                                    images = it.images,
                                    thoughts = it.thoughts,
                                    thoughtTitle = it.thoughtTitle,
                                    tokenCount = it.tokenCount,
                                    status = it.status,
                                    participant = it.participant,
                                    timestamp = it.timestamp,
                                    thoughtTimeMs = it.thoughtTimeMs,
                                    modelName = it.modelName,
                                    segments = it.toolCallJson?.let { json ->
                                        try { Json.decodeFromString<List<MessageSegment>>(json) } catch (_: Exception) { null }
                                    } ?: it.thoughts?.takeIf { t -> t.isNotBlank() }?.let { listOf(MessageSegment(type = "thought", content = it)) },
                                    toolCall = it.toolCallJson?.let { json ->
                                        try {
                                            val segs = Json.decodeFromString<List<MessageSegment>>(json)
                                            segs.lastOrNull { s -> s.type == "tool" }?.let { s ->
                                                val rawResult = s.toolResult ?: ""
                                                ToolCallData(s.toolName ?: "", s.toolArgs ?: "{}", SearchResultFormatter.format(rawResult, appContext))
                                            }
                                        } catch (_: Exception) { null }
                                    },
                                    attachmentMeta = it.attachmentMeta?.let { json ->
                                        try { Json.decodeFromString<AttachmentMeta>(json) } catch (_: Exception) { null }
                                    }
                                )
                            }
                            // Backfill toolCall for old result_ messages persisted without toolCallJson.
                            // They inherit the parent tool_ message's ToolCallData so the provider can
                            // format them as proper "tool" role messages with matching tool_call_id.
                            _allMessages.value = mapped.map { msg ->
                                if (msg.id.startsWith(Constants.RESULT_MSG_PREFIX) && msg.toolCall == null) {
                                    val parentTool = mapped.find { it.id == msg.parentId }
                                    if (parentTool != null && parentTool.toolCall != null) {
                                        msg.copy(toolCall = parentTool.toolCall)
                                    } else msg
                                } else msg
                            }
'''
          new_map = '''                            // Formatting and JSON decoding are CPU-heavy for long histories. Keep
                            // them off Main and decode each tool payload once.
                            val mapped = withContext(Dispatchers.Default) {
                                entities.map { entity ->
                                    val decodedSegments = entity.toolCallJson?.let { json ->
                                        try { Json.decodeFromString<List<MessageSegment>>(json) }
                                        catch (_: Exception) { null }
                                    }
                                    ChatMessage(
                                        id = entity.id,
                                        parentId = entity.parentId,
                                        text = SearchResultFormatter.format(entity.text, appContext),
                                        images = entity.images,
                                        thoughts = entity.thoughts,
                                        thoughtTitle = entity.thoughtTitle,
                                        tokenCount = entity.tokenCount,
                                        status = entity.status,
                                        participant = entity.participant,
                                        timestamp = entity.timestamp,
                                        thoughtTimeMs = entity.thoughtTimeMs,
                                        modelName = entity.modelName,
                                        segments = decodedSegments
                                            ?: entity.thoughts?.takeIf { it.isNotBlank() }
                                                ?.let { listOf(MessageSegment(type = "thought", content = it)) },
                                        toolCall = decodedSegments
                                            ?.lastOrNull { it.type == "tool" }
                                            ?.let { segment ->
                                                ToolCallData(
                                                    segment.toolName.orEmpty(),
                                                    segment.toolArgs ?: "{}",
                                                    SearchResultFormatter.format(segment.toolResult.orEmpty(), appContext)
                                                )
                                            },
                                        attachmentMeta = entity.attachmentMeta?.let { json ->
                                            try { Json.decodeFromString<AttachmentMeta>(json) }
                                            catch (_: Exception) { null }
                                        }
                                    )
                                }
                            }
                            // O(n) legacy tool-result backfill instead of a linear search per row.
                            val mappedById = mapped.associateBy { it.id }
                            _allMessages.value = mapped.map { msg ->
                                if (msg.id.startsWith(Constants.RESULT_MSG_PREFIX) && msg.toolCall == null) {
                                    mappedById[msg.parentId]?.toolCall?.let { msg.copy(toolCall = it) } ?: msg
                                } else msg
                            }
'''
          one(vm, old_map, new_map)
          one(vm,
              '''        switchingJob = viewModelScope.launch {
            kotlinx.coroutines.delay(SWITCH_OVERLAY_FADE_MS) // Allow overlay to fade in
            _isNewChatMode.value = false
            _branchSwitchTrigger.value = null
            messageWindowSize.value = INITIAL_MESSAGE_WINDOW
            _currentConversationId.value = id
            val conversation = convRepo.getConversation(id)
            _currentActiveModel.value = conversation?.modelId
            triggerScrollToMessage()
        }
''',
              '''        // Start Room immediately; the switching overlay can animate concurrently.
        _isNewChatMode.value = false
        _branchSwitchTrigger.value = null
        messageWindowSize.value = INITIAL_MESSAGE_WINDOW
        _currentConversationId.value = id
        switchingJob = viewModelScope.launch {
            val conversation = convRepo.getConversation(id)
            _currentActiveModel.value = conversation?.modelId
            triggerScrollToMessage()
        }
''')

          chat = 'app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt'
          one(chat, '                            delay(500)\n                            this@withTimeout.cancel()',
                    '                            delay(32) // one or two frames are enough; do not hold the blank overlay\n                            this@withTimeout.cancel()')

          ml = 'app/src/main/java/com/newoether/agora/ui/chat/MessageList.kt'
          one(ml,
              '''    val currentPath = messages.list.filter { it.participant != Participant.ERROR }
    val contextStartIndex = if (currentPath.size > maxContextWindow) currentPath.size - maxContextWindow else 0
    val inContextIds = currentPath.drop(contextStartIndex).map { it.id }.toSet()

    val lastUserMessageIndex = messages.list.indexOfLast { it.participant == Participant.USER }
''',
              '''    // Height callbacks and scrolling recompose this container frequently. Cache all
    // history-wide scans so they only rerun when the actual message window changes.
    val inContextIds = remember(messages, maxContextWindow) {
        val currentPath = messages.list.filter { it.participant != Participant.ERROR }
        currentPath.takeLast(maxContextWindow.coerceAtLeast(0)).mapTo(HashSet()) { it.id }
    }
    val lastUserMessageIndex = remember(messages) {
        messages.list.indexOfLast { it.participant == Participant.USER }
    }
''')

          safe = 'app/src/main/java/com/newoether/agora/ui/chat/message/RecomposeSafeMarkdown.kt'
          one(safe,
              '''    render: @Composable (text: String) -> Unit
) {
    var buf0 by remember { mutableStateOf("") }
''',
              '''    render: @Composable (text: String) -> Unit
) {
    // Stored history does not need streaming crossfade. Rendering it directly avoids
    // one effect, two retained strings and (during transitions) two Markdown trees per item.
    if (!isStreaming) {
        render(content)
        return
    }
    var buf0 by remember { mutableStateOf("") }
''')

          json_path = 'app/src/main/java/com/newoether/agora/ui/chat/message/MessageItemJson.kt'
          p = Path(json_path)
          s = p.read_text()
          s = s.replace('''private fun parseJsonOrNull(text: String): JsonElement? {
    return try { Json.parseToJsonElement(text) } catch (_: Exception) { null }
}
''', '''private const val MAX_STRUCTURED_JSON_CHARS = 64 * 1024
private const val MAX_PLAIN_PREVIEW_CHARS = 32 * 1024
private const val MAX_JSON_DEPTH = 12
private const val MAX_JSON_CHILDREN = 200

private fun parseJsonOrNull(text: String): JsonElement? {
    if (text.length > MAX_STRUCTURED_JSON_CHARS) return null
    // Maliciously/deeply nested JSON may throw StackOverflowError, not Exception.
    return try { Json.parseToJsonElement(text) } catch (_: Throwable) { null }
}
''')
          s = s.replace('''private fun JsonNodeView(json: JsonElement, depth: Int = 0) {
    when (json) {''', '''private fun JsonNodeView(json: JsonElement, depth: Int = 0) {
    if (depth >= MAX_JSON_DEPTH) {
        Text("… nested JSON truncated", style = ChatType.meta,
            color = MaterialTheme.colorScheme.onSurfaceVariant)
        return
    }
    when (json) {''')
          s = s.replace('''        obj.entries.forEach { (key, value) ->''', '''        obj.entries.take(MAX_JSON_CHILDREN).forEach { (key, value) ->''')
          s = s.replace('''            }
        }
    }
}

@Composable
private fun JsonArrayView''', '''            }
        }
        if (obj.size > MAX_JSON_CHILDREN) {
            Text("… ${obj.size - MAX_JSON_CHILDREN} more fields", style = ChatType.meta,
                color = MaterialTheme.colorScheme.onSurfaceVariant)
        }
    }
}

@Composable
private fun JsonArrayView''', 1)
          s = s.replace('''            arr.forEachIndexed { i, item ->''', '''            arr.take(MAX_JSON_CHILDREN).forEachIndexed { i, item ->''')
          old_plain = '''    } else {
        SelectionContainer {
            Text(
                text = text,
                style = ChatType.thoughtCodeLarge,
                color = MaterialTheme.colorScheme.onSurface
            )
        }
    }
}'''
          new_plain = '''    } else {
        val truncated = text.length > MAX_PLAIN_PREVIEW_CHARS
        val preview = if (truncated) text.take(MAX_PLAIN_PREVIEW_CHARS) else text
        SelectionContainer {
            Column {
                if (truncated) {
                    Text(
                        text = "Large JSON (${text.length} chars) — preview truncated for stability",
                        style = ChatType.meta,
                        color = MaterialTheme.colorScheme.tertiary,
                        modifier = Modifier.padding(bottom = 6.dp)
                    )
                }
                Text(
                    text = preview,
                    style = ChatType.thoughtCodeLarge,
                    color = MaterialTheme.colorScheme.onSurface
                )
            }
        }
    }
}'''
          if old_plain not in s: raise SystemExit('JSON plain marker mismatch')
          p.write_text(s.replace(old_plain, new_plain))

          gradle = 'app/build.gradle.kts'
          one(gradle, '        versionCode = 28\n        versionName = "1.4.0-workbench"',
                      '        versionCode = 29\n        versionName = "1.4.1-workbench"')
          PY

          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java app/build.gradle.kts
          git commit -m 'perf: optimize long chat loading and bound large JSON rendering'
          git push origin HEAD:${GITHUB_REF_NAME}
