name: Apply chat history performance fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chat loading and large JSON rendering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if new in s: return
                  raise SystemExit(f'marker mismatch: {path}: {old[:100]!r}')
              if s.count(old)!=1: raise SystemExit(f'non-unique marker: {path}')
              p.write_text(s.replace(old,new))

