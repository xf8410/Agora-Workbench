name: Apply chat history performance fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_chat_performance_fix.py'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-chat-history-white-screen
          fetch-depth: 0
      - name: Remove upstream rating form
        run: python3 scripts/remove_upstream_rating_form.py
      - name: Commit patch
        run: |
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java
          git diff --cached --check
          git commit -m 'chore: remove upstream rating form from Workbench'
          git push origin HEAD:workbench/fix-chat-history-white-screen
