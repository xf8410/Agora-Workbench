name: Merge Uma broad local reader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge validated feature branch into main
        run: |
          set -euo pipefail
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git fetch origin workbench/uma-broad-local-reader
          git merge --no-ff origin/workbench/uma-broad-local-reader \
            -m 'merge: Uma broad local reader'
          git push origin HEAD:main
