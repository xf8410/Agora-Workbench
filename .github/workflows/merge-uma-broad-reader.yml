name: Legacy feature-specific direct merge (disabled)

# A feature-specific workflow must not merge an old fixed branch into main. Use the common
# reviewed integration procedure after rebasing on the current main HEAD.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Disabled: feature-specific direct pushes to main are prohibited."
          exit 1
