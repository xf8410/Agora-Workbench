name: Fix current unit tests once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/fix-current-unit-tests-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - run: python3 scripts/fix_current_unit_tests.py
      - run: git rm scripts/fix_current_unit_tests.py .github/workflows/fix-current-unit-tests-once.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/tool/RagToolProvider.kt \
                  app/src/test/java/com/newoether/agora/WorkbenchReleaseMetadataTest.kt \
                  app/src/test/java/com/newoether/agora/workspace/WorkspaceOutputPolicyTest.kt
          git commit -m "fix(ci): 修复 RAG 类型边界与版本元数据测试"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
