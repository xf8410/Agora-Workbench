name: Fix release metadata test once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/fix-release-metadata-test-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - run: python3 scripts/fix_release_metadata_test.py
      - run: git rm scripts/fix_release_metadata_test.py .github/workflows/fix-release-metadata-test-once.yml .github/ci-head-failure.log
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test/java/com/newoether/agora/WorkbenchReleaseMetadataTest.kt
          git commit -m "fix(test): 从 Android 模块工作目录读取版本元数据"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
