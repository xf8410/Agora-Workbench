name: Apply GitHub Confirmation and Memory Sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Add confirmation gate and background memory sync
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/newoether/agora/github/GitHubMemorySyncWorker.kt <<'KOTLIN'
          package com.newoether.agora.github

          import android.content.Context
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import java.io.File
          import java.util.concurrent.TimeUnit

          /**
           * Uploads only small, curated memory files. Raw chats, logs, artifacts and credentials
           * are never included. Each mutation replaces the pending delayed job, coalescing bursts.
           */
          class GitHubMemorySyncWorker(
              appContext: Context,
              params: WorkerParameters,
          ) : CoroutineWorker(appContext, params) {
              override suspend fun doWork(): Result {
                  val auth = GitHubAuthManager(applicationContext)
                  if (auth.loadSession() == null || !auth.isMemorySyncEnabled()) return Result.success()
                  val client = GitHubApiClient(applicationContext)
                  return try {
                      val files = collectMemoryFiles()
                      for ((remotePath, file) in files) {
                          val content = file.readText(Charsets.UTF_8)
                          if (content.toByteArray(Charsets.UTF_8).size > MAX_FILE_BYTES) continue
                          if (containsSecret(content)) {
                              auth.setMemorySyncStatus("blocked: possible credential in ${file.name}")
                              return Result.failure()
                          }
                          client.writeFile(
                              repo = auth.memorySyncRepo(),
                              path = "workspace-memory/$remotePath",
                              branch = auth.memorySyncBranch(),
                              message = "memory: sync $remotePath",
                              content = content,
                          )
                      }
                      auth.setMemorySyncStatus("ok:${System.currentTimeMillis()}")
                      Result.success()
                  } catch (e: Exception) {
                      auth.setMemorySyncStatus("retry:${e.javaClass.simpleName}")
                      Result.retry()
                  }
              }

              private fun collectMemoryFiles(): List<Pair<String, File>> {
                  val result = mutableListOf<Pair<String, File>>()
                  val active = File(applicationContext.filesDir, "active_memory.md")
                  if (active.isFile) result += "active-memory.md" to active
                  val dir = File(applicationContext.filesDir, "memory_db")
                  dir.listFiles()?.asSequence()
                      ?.filter { it.isFile && (it.extension == "md" || it.name == "memory_meta.json") }
                      ?.sortedBy { it.name }
                      ?.forEach { result += "memories/${it.name}" to it }
                  return result
              }

              private fun containsSecret(value: String): Boolean {
                  val patterns = listOf(
                      Regex("ghp_[A-Za-z0-9]{20,}"),
                      Regex("github_pat_[A-Za-z0-9_]{20,}"),
                      Regex("(?i)authorization\\s*:\\s*bearer\\s+\\S+"),
                      Regex("(?i)(access_token|refresh_token|client_secret)\\s*[:=]\\s*[^\\s]+"),
                      Regex("-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
                      Regex("(?i)cookie\\s*:\\s*\\S+"),
                  )
                  return patterns.any { it.containsMatchIn(value) }
              }

              companion object {
                  private const val UNIQUE_WORK = "github-memory-sync"
                  private const val MAX_FILE_BYTES = 256 * 1024

                  fun enqueue(context: Context) {
                      val request = OneTimeWorkRequestBuilder<GitHubMemorySyncWorker>()
                          .setInitialDelay(5, TimeUnit.SECONDS)
                          .build()
                      WorkManager.getInstance(context.applicationContext)
                          .enqueueUniqueWork(UNIQUE_WORK, ExistingWorkPolicy.REPLACE, request)
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if new in s: return
                  raise SystemExit(f'marker mismatch: {path}: {old[:100]!r}')
              if s.count(old) != 1: raise SystemExit(f'non-unique marker: {path}')
              p.write_text(s.replace(old,new))

          # GitHub auth preferences: private defaults for this single-user Workbench.
          p='app/src/main/java/com/newoether/agora/github/GitHubAuthManager.kt'
          replace_once(p,
              '''    fun savedClientId(): String = prefs.getString(KEY_CLIENT_ID, "") ?: ""''',
              '''    fun savedClientId(): String = prefs.getString(KEY_CLIENT_ID, "") ?: ""

              fun isMemorySyncEnabled(): Boolean = prefs.getBoolean(KEY_MEMORY_SYNC_ENABLED, true)
              fun setMemorySyncEnabled(enabled: Boolean) = prefs.edit().putBoolean(KEY_MEMORY_SYNC_ENABLED, enabled).apply()
              fun memorySyncRepo(): String = prefs.getString(KEY_MEMORY_SYNC_REPO, DEFAULT_MEMORY_REPO) ?: DEFAULT_MEMORY_REPO
              fun memorySyncBranch(): String = prefs.getString(KEY_MEMORY_SYNC_BRANCH, "main") ?: "main"
              fun memorySyncStatus(): String = prefs.getString(KEY_MEMORY_SYNC_STATUS, "never") ?: "never"
              fun setMemorySyncStatus(value: String) = prefs.edit().putString(KEY_MEMORY_SYNC_STATUS, value.take(200)).apply()''')
          replace_once(p,
              '''        const val KEY_CLIENT_ID = "oauth_client_id"''',
              '''        const val KEY_CLIENT_ID = "oauth_client_id"
                  const val KEY_MEMORY_SYNC_ENABLED = "memory_sync_enabled"
                  const val KEY_MEMORY_SYNC_REPO = "memory_sync_repo"
                  const val KEY_MEMORY_SYNC_BRANCH = "memory_sync_branch"
                  const val KEY_MEMORY_SYNC_STATUS = "memory_sync_status"
                  const val DEFAULT_MEMORY_REPO = "xf8410/Agora-Workbench"''')

          # Notify the background worker after successful memory mutations.
          p='app/src/main/java/com/newoether/agora/data/MemoryManager.kt'
          replace_once(p,
              '''class MemoryManager(context: Context) {
              private val memoryDir: File =''',
              '''class MemoryManager(context: Context) {
                  private val appContext = context.applicationContext
                  private val memoryDir: File =''')
          replace_once(p,
              '''    private val json = Json { ignoreUnknownKeys = true; prettyPrint = true }''',
              '''    private val json = Json { ignoreUnknownKeys = true; prettyPrint = true }

                  private fun scheduleSync() {
                      com.newoether.agora.github.GitHubMemorySyncWorker.enqueue(appContext)
                  }''')
          # Insert scheduleSync before successful returns in all mutation methods.
          replacements = [
              ('activeMemoryFile.appendText("\\n$content")\n            "Appended to active memory."', 'activeMemoryFile.appendText("\\n$content")\n            scheduleSync()\n            "Appended to active memory."'),
              ('activeMemoryFile.writeText("$content\\n$existing")\n            "Prepended to active memory."', 'activeMemoryFile.writeText("$content\\n$existing")\n            scheduleSync()\n            "Prepended to active memory."'),
              ('activeMemoryFile.writeText(existing.replace(oldString, newString ?: ""))\n            "Active memory patched."', 'activeMemoryFile.writeText(existing.replace(oldString, newString ?: ""))\n            scheduleSync()\n            "Active memory patched."'),
              ('activeMemoryFile.writeText(content)\n            "Active memory updated."', 'activeMemoryFile.writeText(content)\n            scheduleSync()\n            "Active memory updated."'),
              ('return "Created ${file.name}"', 'scheduleSync()\n        return "Created ${file.name}"'),
              ('saveMeta(meta)\n        val targetName =', 'saveMeta(meta)\n        scheduleSync()\n        val targetName ='),
              ('saveMeta(meta)\n        return "Deleted ${file.name}"', 'saveMeta(meta)\n        scheduleSync()\n        return "Deleted ${file.name}"'),
          ]
          for old,new in replacements:
              s=Path(p).read_text()
              if old not in s:
                  if new in s: continue
                  raise SystemExit(f'memory mutation marker mismatch: {old[:80]!r}')
              Path(p).write_text(s.replace(old,new,1))

          # GitHub write confirmation reuses the existing shell confirmation controller.
          p='app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt'
          replace_once(p,
              '''class GitHubToolProvider(context: Context) : ToolProvider {
              private val client = GitHubApiClient(context.applicationContext)''',
              '''class GitHubToolProvider(context: Context) : ToolProvider {
                  private val client = GitHubApiClient(context.applicationContext)
                  var confirm: (suspend (summary: String) -> Boolean)? = null''')
          replace_once(p,
              '''                "github_create_branch" -> buildJsonObject {''',
              '''                "github_create_branch" -> {
                          if (confirm?.invoke("Create GitHub branch ${arg("repo")}:${arg("branch")}") == false) return errorJson("Denied by user")
                          buildJsonObject {''')
          replace_once(p,
              '''                    put("ok", true)
                  }.toString()
                  "github_write_file" -> buildJsonObject {''',
              '''                    put("ok", true)
                          }.toString()
                      }
                      "github_write_file" -> {
                          if (confirm?.invoke("Commit ${arg("repo")}:${arg("branch")}/${arg("path")}") == false) return errorJson("Denied by user")
                          buildJsonObject {''')
          replace_once(p,
              '''                    put("ok", true)
                  }.toString()
                  "github_get_workflow_runs" ->''',
              '''                    put("ok", true)
                          }.toString()
                      }
                      "github_get_workflow_runs" ->''')
          replace_once(p,
              '''                "github_dispatch_workflow" -> dispatch(arg("repo"), arg("workflow"), arg("ref", "main"))''',
              '''                "github_dispatch_workflow" -> {
                          if (confirm?.invoke("Dispatch ${arg("repo")} workflow ${arg("workflow")}") == false) return errorJson("Denied by user")
                          dispatch(arg("repo"), arg("workflow"), arg("ref", "main"))
                      }''')

          p='app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt'
          replace_once(p,
              '''    private val githubToolProvider = com.newoether.agora.tool.GitHubToolProvider(app)''',
              '''    private val githubToolProvider = com.newoether.agora.tool.GitHubToolProvider(app).also { provider ->
                  provider.confirm = { summary -> onConfirmShellCommand?.invoke("GitHub", summary) ?: true }
              }''')
          PY

          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/github/GitHubMemorySyncWorker.kt \
                  app/src/main/java/com/newoether/agora/github/GitHubAuthManager.kt \
                  app/src/main/java/com/newoether/agora/data/MemoryManager.kt \
                  app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt \
                  app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          git commit -m 'feat: confirm GitHub writes and auto-sync safe memory files'
          git push origin HEAD:main
