name: Remove obsolete patch workflows

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Permanently remove obsolete one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/apply-separate-public-read.yml \
            .github/workflows/repair-public-browser-branch.yml \
            .github/workflows/validate-public-repository-browser.yml \
            .github/workflows/remove-obsolete-workflows.yml
          if git diff --cached --quiet; then
            echo 'Nothing to remove.'
            exit 0
          fi
          git commit -m 'chore: remove obsolete one-shot patch workflows'
          git push origin HEAD:${{ github.ref_name }}
