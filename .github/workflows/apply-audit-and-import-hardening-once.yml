name: Apply import hardening + audit registration once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/binary-audit-tools
          fetch-depth: 0
      - name: Apply surgical patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def apply(path_str, replacements):
              p = Path(path_str)
              s = p.read_text()
              changed = False
              for old, new in replacements:
                  if new in s:
                      continue  # already applied (idempotent)
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_str}: expected exactly one match, got {count} for {old!r}')
                  s = s.replace(old, new)
                  changed = True
              if changed:
                  p.write_text(s)
                  print(f'patched {path_str}')
              else:
                  print(f'already applied: {path_str}')

          # 1) Register BinaryAuditToolProvider in GenerationManager
          apply('app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt', [
              (
                  "    private val umaToolProvider = com.newoether.agora.tool.UmaToolProvider()\n",
                  "    private val umaToolProvider = com.newoether.agora.tool.UmaToolProvider()\n"
                  "    private val binaryAuditToolProvider = com.newoether.agora.tool.BinaryAuditToolProvider(app)\n",
              ),
              (
                  "        publicContributionTraceToolProvider, umaToolProvider, shellToolProvider\n    )\n",
                  "        publicContributionTraceToolProvider, umaToolProvider, shellToolProvider,\n"
                  "        binaryAuditToolProvider\n    )\n",
              ),
          ])

          # 2) Guard test expected set
          apply('app/src/test/java/com/newoether/agora/tool/ToolProviderRegistrationTest.kt', [
              (
                  '            "UmaToolProvider",\n            "ShellToolProvider",\n',
                  '            "UmaToolProvider",\n            "BinaryAuditToolProvider",\n            "ShellToolProvider",\n',
              ),
          ])

          # 3) ImageProcessor: OOM must not kill the send pipeline
          apply('app/src/main/java/com/newoether/agora/viewmodel/ImageProcessor.kt', [
              (
                  "            } catch (_: Exception) {\n"
                  "                emptyList()\n"
                  "            }\n",
                  "            } catch (_: Exception) {\n"
                  "                emptyList()\n"
                  "            } catch (_: OutOfMemoryError) {\n"
                  "                emptyList()\n"
                  "            }\n",
              ),
          ])

          # 4) ChatComposerState: OOM guards on pick-time copy + video frames
          apply('app/src/main/java/com/newoether/agora/ui/chat/bottombar/ChatComposerState.kt', [
              (
                  "            } catch (_: Exception) {\n"
                  "                runCatching { target.delete() }\n"
                  "                null\n"
                  "            }\n",
                  "            } catch (_: Exception) {\n"
                  "                runCatching { target.delete() }\n"
                  "                null\n"
                  "            } catch (_: OutOfMemoryError) {\n"
                  "                runCatching { target.delete() }\n"
                  "                null\n"
                  "            }\n",
              ),
              (
                  '            } catch (e: Exception) { DebugLog.e("ChatComposer", "Video frame extraction failed", e) }\n'
                  "            processingStates = processingStates - videoUri\n",
                  '            } catch (e: Exception) { DebugLog.e("ChatComposer", "Video frame extraction failed", e) } catch (o: OutOfMemoryError) { DebugLog.e("ChatComposer", "Video frame extraction OOM", o) }\n'
                  "            processingStates = processingStates - videoUri\n",
              ),
          ])

          # 5) DataImporter: never read whole media entries into the heap; OOM is a reported error
          apply('app/src/main/java/com/newoether/agora/data/DataImporter.kt', [
              (
                  "        fun names(): List<String> =\n"
                  "            zip.entries().asSequence().filterNot { it.isDirectory }.map { it.name }.toList()\n",
                  "        fun names(): List<String> =\n"
                  "            zip.entries().asSequence().filterNot { it.isDirectory }.map { it.name }.toList()\n"
                  "\n"
                  "        /** First [count] bytes of an entry — for magic-byte sniffing without heap spikes. */\n"
                  "        fun head(name: String, count: Int): ByteArray? =\n"
                  "            zip.getEntry(name)?.let { e ->\n"
                  "                zip.getInputStream(e).use { s ->\n"
                  "                    val buf = ByteArray(count)\n"
                  "                    var off = 0\n"
                  "                    while (off < buf.size) {\n"
                  "                        val r = s.read(buf, off, buf.size - off)\n"
                  "                        if (r < 0) break\n"
                  "                        off += r\n"
                  "                    }\n"
                  "                    if (off == 0) null else buf.copyOf(off)\n"
                  "                }\n"
                  "            }\n"
                  "\n"
                  "        /** Stream an entry straight to disk — the entry never enters the heap. */\n"
                  "        fun copyEntryTo(name: String, target: java.io.File): Boolean {\n"
                  "            val e = zip.getEntry(name) ?: return false\n"
                  "            zip.getInputStream(e).use { s -> target.outputStream().use { s.copyTo(it) } }\n"
                  "            return true\n"
                  "        }\n",
              ),
              (
                  '                            val bytes = archive.bytes(path) ?: continue\n'
                  '                            // path format: images/<messageId>/<index>\n'
                  '                            val parts = path.removePrefix("images/").split("/")\n'
                  '                            if (parts.size == 2) {\n'
                  '                                val msgId = parts[0]\n'
                  '                                val ext = detectImageExtension(bytes)\n'
                  '                                val imgFile = java.io.File(imagesDir, "${msgId}_${parts[1]}.$ext")\n'
                  '                                imgFile.writeBytes(bytes)\n',
                  '                            val magic = archive.head(path, 4) ?: continue\n'
                  '                            // path format: images/<messageId>/<index>\n'
                  '                            val parts = path.removePrefix("images/").split("/")\n'
                  '                            if (parts.size == 2) {\n'
                  '                                val msgId = parts[0]\n'
                  '                                val ext = detectImageExtension(magic)\n'
                  '                                val imgFile = java.io.File(imagesDir, "${msgId}_${parts[1]}.$ext")\n'
                  '                                archive.copyEntryTo(path, imgFile)\n',
              ),
              (
                  '                            val bytes = archive.bytes(path) ?: continue\n'
                  '                            // path format: videos/<messageId>/<index>\n'
                  '                            val parts = path.removePrefix("videos/").split("/")\n'
                  '                            if (parts.size == 2 && bytes.isNotEmpty()) {\n'
                  '                                val msgId = parts[0]\n'
                  '                                val ext = detectVideoExtension(bytes)\n'
                  '                                val vidFile = java.io.File(context.filesDir, "vid_import_${java.util.UUID.randomUUID()}.$ext")\n'
                  '                                vidFile.writeBytes(bytes)\n'
                  '                                videoCleanupList.add(vidFile)\n',
                  '                            val magic = archive.head(path, 4) ?: continue\n'
                  '                            // path format: videos/<messageId>/<index>\n'
                  '                            val parts = path.removePrefix("videos/").split("/")\n'
                  '                            if (parts.size == 2 && magic.isNotEmpty()) {\n'
                  '                                val msgId = parts[0]\n'
                  '                                val ext = detectVideoExtension(magic)\n'
                  '                                val vidFile = java.io.File(context.filesDir, "vid_import_${java.util.UUID.randomUUID()}.$ext")\n'
                  '                                if (!archive.copyEntryTo(path, vidFile)) continue\n'
                  '                                videoCleanupList.add(vidFile)\n',
              ),
              (
                  '                } catch (e: Exception) {\n'
                  '                    // Clean up restored video files on error\n'
                  '                    for (f in videoCleanupList) { try { f.delete() } catch (_: Exception) {} }\n'
                  '                    errors.add("Conversations: ${e.localizedMessage ?: "Unknown error"}")\n'
                  '                }\n',
                  '                } catch (e: Exception) {\n'
                  '                    // Clean up restored video files on error\n'
                  '                    for (f in videoCleanupList) { try { f.delete() } catch (_: Exception) {} }\n'
                  '                    errors.add("Conversations: ${e.localizedMessage ?: "Unknown error"}")\n'
                  '                } catch (o: OutOfMemoryError) {\n'
                  '                    for (f in videoCleanupList) { try { f.delete() } catch (_: Exception) {} }\n'
                  '                    errors.add("Conversations: 内存不足 (OOM) — 备份内含超大媒体文件，该分类已中止")\n'
                  '                }\n',
              ),
          ])
          PY
      - name: Commit patches
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "feat: register BinaryAuditToolProvider + import-path OOM hardening

- GenerationManager.builtInToolProviders + guard test: audit tools live
- DataImporter: media entries stream to disk (head+copyEntryTo), OOM reported per category instead of killing the coroutine
- ImageProcessor/ChatComposerState: OutOfMemoryError caught at pick/decode boundaries"
          git push origin HEAD:workbench/binary-audit-tools
