name: Legacy workspace artifact source patcher (disabled)

# The workspace implementation now lives in source. Re-running this old textual patch can
# overwrite newer code, so this workflow is intentionally non-mutating.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Disabled: update workspace source through a workbench/* branch."
          exit 1
