name: Apply Workspace Artifact Pipeline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Add persistent workspace and local artifact streaming
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, flags=0):
              p=Path(path); s=p.read_text()
              out,n=re.subn(pattern,replacement,s,count=1,flags=flags)
              if n != 1:
                  if replacement.strip() in s: return
                  raise SystemExit(f'pattern mismatch: {path}: {pattern[:100]}')
              p.write_text(out)

          iface='app/src/main/java/com/newoether/agora/sandbox/SandboxManager.kt'
          sub(iface,
              r'''    data class SandboxResult\(\n        val stdout: String,\n        val stderr: String,\n        val exitCode: Int\n    \)''',
              '''    data class SandboxResult(
                  val stdout: String,
                  val stderr: String,
                  val exitCode: Int,
                  /** Full command output retained on disk when it exceeds the inline preview. */
                  val artifactPath: String? = null,
                  val artifactSizeBytes: Long = 0L,
              )''')

          proot='app/src/fdroid/java/com/newoether/agora/sandbox/ProotSandboxManager.kt'
          sub(proot,
              r'''    private val homeMountDir: File = File\(context\.filesDir, "sandbox-home"\)\n    private val homeMountPath = "/home/agora"''',
              '''    private val homeMountDir: File = File(context.filesDir, "sandbox-home")
                  private val homeMountPath = "/home/agora"
                  /** Large persistent work area backed by the phone's external app storage. */
                  private val workspaceDir: File = (context.getExternalFilesDir("workspace")
                      ?: File(context.filesDir, "workspace")).apply { mkdirs() }
                  private val workspaceMountPath = "/workspace"
                  private val inlinePreviewBytes = 24 * 1024''')
          sub(proot,
              r'''            "--bind=\$\{homeMountDir\.absolutePath}:\$homeMountPath",\n            "-w", resolvedWorkdir,''',
              '''            "--bind=${homeMountDir.absolutePath}:$homeMountPath",
                  "--bind=${workspaceDir.absolutePath}:$workspaceMountPath",
                  "-w", resolvedWorkdir,''')
          sub(proot,
              r'''            val p = pb\.start\(\)\n            val out = p\.inputStream\.bufferedReader\(\)\.readText\(\)\n            val ok = p\.waitFor\(timeoutMs\.toLong\(\), java\.util\.concurrent\.TimeUnit\.MILLISECONDS\)\n            if \(!ok\) \{ p\.destroyForcibly\(\); SandboxManager\.SandboxResult\(out, "Timed out", -1\) \}\n            else SandboxManager\.SandboxResult\(out, "", p\.exitValue\(\)\)''',
              '''            val artifactDir = File(workspaceDir, "artifacts").apply { mkdirs() }
                  val artifactFile = File.createTempFile("shell-", ".log", artifactDir)
                  pb.redirectOutput(artifactFile)
                  val p = pb.start()
                  val ok = p.waitFor(timeoutMs.toLong(), java.util.concurrent.TimeUnit.MILLISECONDS)
                  if (!ok) {
                      p.destroyForcibly()
                      p.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                  }
                  val size = artifactFile.length()
                  val previewSize = minOf(size, inlinePreviewBytes.toLong()).toInt()
                  val previewBytes = ByteArray(previewSize)
                  if (previewSize > 0) {
                      artifactFile.inputStream().use { input ->
                          var offset = 0
                          while (offset < previewBytes.size) {
                              val read = input.read(previewBytes, offset, previewBytes.size - offset)
                              if (read < 0) break
                              offset += read
                          }
                      }
                  }
                  val preview = previewBytes.toString(Charsets.UTF_8)
                  if (size <= inlinePreviewBytes) {
                      artifactFile.delete()
                      SandboxManager.SandboxResult(
                          preview, if (ok) "" else "Timed out", if (ok) p.exitValue() else -1
                      )
                  } else {
                      SandboxManager.SandboxResult(
                          stdout = preview,
                          stderr = if (ok) "" else "Timed out",
                          exitCode = if (ok) p.exitValue() else -1,
                          artifactPath = "$workspaceMountPath/artifacts/${artifactFile.name}",
                          artifactSizeBytes = size,
                      )
                  }''')
          sub(proot,
              r'''    private fun ensureSandboxMountTargets\(\) \{\n        homeMountDir\.mkdirs\(\)\n        File\(rootfsDir, homeMountPath\.trimStart\('/'\)\)\.mkdirs\(\)\n    \}''',
              '''    private fun ensureSandboxMountTargets() {
                  homeMountDir.mkdirs()
                  workspaceDir.mkdirs()
                  listOf("repos", "tasks", "artifacts", "builds", "logs", "cache", "tmp", "memory")
                      .forEach { File(workspaceDir, it).mkdirs() }
                  File(rootfsDir, homeMountPath.trimStart('/')).mkdirs()
                  File(rootfsDir, workspaceMountPath.trimStart('/')).mkdirs()
              }''')
          sub(proot,
              r'''        if \(normalized == homeMountPath \|\| normalized\.startsWith\("\$homeMountPath/"\)\) \{''',
              '''        if (normalized == workspaceMountPath || normalized.startsWith("$workspaceMountPath/")) {
                  ensureSandboxMountTargets()
                  val root = workspaceDir.canonicalFile
                  val suffix = normalized.removePrefix(workspaceMountPath).trimStart('/')
                  val resolved = File(root, suffix).canonicalFile
                  require(resolved.absolutePath == root.absolutePath || resolved.absolutePath.startsWith(root.absolutePath + File.separator)) {
                      "Path traversal: $path"
                  }
                  return ResolvedSandboxPath(resolved, root, workspaceMountPath)
              }

                  if (normalized == homeMountPath || normalized.startsWith("$homeMountPath/")) {''')

          PY
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/sandbox/SandboxManager.kt \
                  app/src/fdroid/java/com/newoether/agora/sandbox/ProotSandboxManager.kt 
          git commit -m 'feat: add persistent workspace and stream sandbox output to artifacts'
          git push origin HEAD:main
