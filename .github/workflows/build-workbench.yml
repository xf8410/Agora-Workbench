name: Build Agora Workbench APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest 2>&1 | tee unit-test-console.log
      - name: Preserve unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            unit-test-console.log
            app/build/reports/tests/
            app/build/test-results/
      - name: Build APK (verify main SHA compiles)
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
