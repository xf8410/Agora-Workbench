name: Build Agora Workbench APK

on:
  workflow_dispatch:

concurrency:
  group: agora-workbench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply generation durability phase3
        if: github.ref == 'refs/heads/workbench/root-fix-conversation-loss-v5-phase3'
        run: |
          python3 scripts/apply_conversation_loss_v5_phase3.py
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          git diff --cached --check
          git commit -m 'fix: checkpoint generation and verify terminal persistence'
          git push origin HEAD:workbench/root-fix-conversation-loss-v5-phase3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Test and build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest assembleFdroidDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-conversation-loss-v5-phase3-${{ github.run_id }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
