name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose-full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        id: ndk
        continue-on-error: true
        shell: bash
        run: sdkmanager 'ndk;28.2.13676358' 2>&1 | tee ci-ndk.log

      - name: Diagnose signing
        id: signing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          signing_dir="$RUNNER_TEMP/workbench-signing"
          mkdir -p "$signing_dir"
          cd "$signing_dir"
          gh release download workbench-signing-key --repo "$REPOSITORY" \
            --pattern 'workbench-upload.jks' --pattern 'signing.env' --dir .
          test -s workbench-upload.jks
          test -s signing.env
          source signing.env
          keytool -list -keystore workbench-upload.jks -storepass "$KEYSTORE_PASSWORD" -alias workbench
          {
            echo "storeFile=$signing_dir/workbench-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=workbench"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/local.properties"
        2>&1 | tee "$GITHUB_WORKSPACE/ci-signing.log"

      - name: Diagnose proot build
        id: proot
        continue-on-error: true
        shell: bash
        run: bash build-proot.sh 2>&1 | tee ci-proot.log

      - name: Diagnose release build
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace \
            testFdroidDebugUnitTest assembleFdroidRelease 2>&1 | tee ci-gradle-release.log

      - name: Commit all diagnostic logs
        if: always()
        shell: bash
        run: |
          printf 'ndk=%s\nsigning=%s\nproot=%s\ngradle=%s\n' \
            '${{ steps.ndk.outcome }}' '${{ steps.signing.outcome }}' \
            '${{ steps.proot.outcome }}' '${{ steps.gradle.outcome }}' > ci-stage-results.txt
          git config user.name 'Agora Workbench Bot'
          git config user.email 'actions@github.com'
          git add -f ci-*.log ci-stage-results.txt
          git commit -m 'Record full APK build diagnostics' || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve stage failures
        if: steps.ndk.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.proot.outcome == 'failure' || steps.gradle.outcome == 'failure'
        run: exit 1
