name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply bounded keyset repair
        if: github.ref == 'refs/heads/workbench/root-fix-conversation-loss-v5-phase4-bounded'
        run: |
          python3 scripts/apply_conversation_loss_v5_phase4_bounded.py
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/data/local/ChatDatabase.kt \
            app/src/main/java/com/newoether/agora/data/repository/ConversationRepository.kt \
            app/src/main/java/com/newoether/agora/viewmodel/ChatViewModel.kt
          git diff --cached --check
          git commit -m 'fix: bound keyset rows and repair history collector structure'
          git push origin HEAD:workbench/root-fix-conversation-loss-v5-phase4-bounded
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Test and build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-conversation-loss-v5-phase4-bounded-${{ github.run_id }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
