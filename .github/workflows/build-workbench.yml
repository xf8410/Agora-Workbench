name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: agora-workbench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  BUILD_FILE: app/build.gradle.kts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply client resilience source integration
        if: github.ref == 'refs/heads/workbench/integrate-client-resilience-fixes'
        run: |
          python3 scripts/apply_client_resilience_integration.py
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app
          git diff --cached --check
          git commit -m 'fix: integrate client white-screen and durability resilience'
          git push origin HEAD:workbench/integrate-client-resilience-fixes
      - name: Verify checked-out identity
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Test and build F-Droid debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest assembleFdroidDebug 2>&1 | tee /tmp/gradle-build.log; then
            tail -n 500 /tmp/gradle-build.log > ci-gradle-failure.log
            git config user.name 'Agora CI Diagnostics'
            git config user.email 'agora-ci@users.noreply.github.com'
            git add ci-gradle-failure.log
            git commit -m 'ci: capture Gradle failure diagnostics [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
            exit 1
          fi
      - name: Prepare traceable APK and manifest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' "$BUILD_FILE" | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' "$BUILD_FILE" | head -n1)"
          build_sha="$(git rev-parse HEAD)"; short_sha="${build_sha:0:12}"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          source_apk="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"; mkdir -p release
          apk_name="Agora-Workbench-${version_name}-vc${version_code}-${short_sha}-run${GITHUB_RUN_ID}.apk"
          cp "$source_apk" "release/$apk_name"
          apk_sha256="$(sha256sum "release/$apk_name" | awk '{print $1}')"
          printf '%s  %s\n' "$apk_sha256" "$apk_name" > "release/$apk_name.sha256"
          cat > release/build-manifest.json <<EOF
          {"repository":"${GITHUB_REPOSITORY}","branch":"${GITHUB_REF_NAME}","commit":"${build_sha}","versionName":"${version_name}","versionCode":${version_code},"runId":${GITHUB_RUN_ID},"runAttempt":${GITHUB_RUN_ATTEMPT},"builtAtUtc":"${built_at}","apk":"${apk_name}","sha256":"${apk_sha256}"}
          EOF
          cat > release/RELEASE_NOTES.md <<EOF
          Automated Agora Workbench build from the exact checked-out commit.
          - Version: ${version_name} (code ${version_code})
          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${build_sha}
          - Actions run: ${GITHUB_RUN_ID}
          - SHA-256: ${apk_sha256}
          EOF
          echo "artifact_name=Agora-Workbench-${version_name}-${short_sha}-run${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish only verified main HEAD
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: workbench-latest
          target_commitish: ${{ github.sha }}
          name: Agora Workbench ${{ steps.package.outputs.version_name }} (${{ github.sha }})
          make_latest: true
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.apk
            release/*.sha256
            release/build-manifest.json
          fail_on_unmatched_files: true
          overwrite_files: true
