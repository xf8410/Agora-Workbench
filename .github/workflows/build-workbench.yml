name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Build F-Droid debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleFdroidDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          mkdir -p release
          cp "$source_apk" release/Agora-Workbench-1.4.4-workbench-fdroid-debug.apk
          sha256sum release/Agora-Workbench-1.4.4-workbench-fdroid-debug.apk \
            > release/Agora-Workbench-1.4.4-workbench-fdroid-debug.apk.sha256

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-1.4.4-workbench-fdroid-debug
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Agora Workbench 1.4.4 as latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.4-workbench
          target_commitish: ${{ github.sha }}
          name: Agora Workbench v1.4.4-workbench
          prerelease: false
          draft: false
          make_latest: true
          body: |
            Automated Agora Workbench build.

            Version: `1.4.4-workbench`
            Version code: `32`
            Branch: `main`
            Commit: `${{ github.sha }}`

            Adds Agora-controlled protocol capture, hlpatch v3.25 metadata support,
            and a broad bounded reader for non-mutating local SO endpoints.
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
