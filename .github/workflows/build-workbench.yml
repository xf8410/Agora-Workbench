name: Build Agora Workbench APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'workbench/**']
  push:
    branches: [main, 'workbench/**']

permissions:
  contents: read

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Record CI metadata
        run: |
          mkdir -p ci-logs
          cat > ci-logs/manifest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "head_sha": "${GITHUB_SHA}",
            "actor": "${GITHUB_ACTOR}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          timeout --signal=TERM --kill-after=60s 18m \
            ./gradlew --no-daemon --stacktrace --info testFdroidDebugUnitTest \
            > ci-logs/unit-test-console.log 2>&1
          gradle_rc=$?
          tail -n 200 ci-logs/unit-test-console.log || true
          # 让红色开口说话：把关键错误行单独成卷（e: 编译错误 / 测试失败 / gradle 病因），
          # 200 行 tail 会被日志视图的采样跳过，这一卷必须短到不会被跳过。
          grep -nE "^e: |^Caused by:|FAILURE:|What went wrong|> Task .*FAILED| FAILED$|tests completed|BUILD (FAILED|SUCCESSFUL)" \
            ci-logs/unit-test-console.log | tail -n 60 > ci-logs/unit-test-errors.txt || true
          echo "===== 关键错误行（单测）====="
          cat ci-logs/unit-test-errors.txt || true
          # 清掉可能残留的 daemon/编译器子进程，防止持有句柄把 step 拖死
          pkill -f KotlinCompileDaemon 2>/dev/null || true
          pkill -f GradleDaemon 2>/dev/null || true
          exit $gradle_rc

      - name: Build APK
        id: build_apk
        if: steps.unit_tests.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew --no-daemon --stacktrace assembleFdroidDebug \
            > ci-logs/apk-build-console.log 2>&1
          gradle_rc=$?
          tail -n 100 ci-logs/apk-build-console.log || true
          grep -nE "^e: |^Caused by:|FAILURE:|What went wrong|> Task .*FAILED|BUILD (FAILED|SUCCESSFUL)" \
            ci-logs/apk-build-console.log | tail -n 60 > ci-logs/apk-errors.txt || true
          echo "===== 关键错误行（打包）====="
          cat ci-logs/apk-errors.txt || true
          pkill -f GradleDaemon 2>/dev/null || true
          exit $gradle_rc

      - name: Verify APK output
        id: verify_apk
        if: steps.unit_tests.outcome == 'success' && steps.build_apk.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
          sha256sum "$apk_path" | tee ci-logs/apk.sha256

      - name: Write CI conclusion
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
        run: |
          cat > ci-logs/conclusion.txt <<EOF
          unit_tests=${UNIT_OUTCOME}
          build_apk=${BUILD_OUTCOME}
          verify_apk=${VERIFY_OUTCOME}
          EOF
          cp -R app/build/reports/tests ci-logs/test-reports 2>/dev/null || true
          cp -R app/build/test-results ci-logs/test-results 2>/dev/null || true
          cat ci-logs/conclusion.txt >> "$GITHUB_STEP_SUMMARY"
          cat ci-logs/unit-test-errors.txt ci-logs/apk-errors.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload durable CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK
        if: steps.unit_tests.outcome == 'success' && steps.build_apk.outcome == 'success' && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: agora-workbench-debug-${{ github.sha }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Enforce CI result
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
        run: |
          # 最后一步先把错误卷再打一遍——保证作业日志的结尾就是错误本身，
          # 日志采样视图再怎么跳也跳不过去（让红色开口说话）。
          echo "===== 错误卷（作业日志结尾回放）====="
          cat ci-logs/unit-test-errors.txt ci-logs/apk-errors.txt 2>/dev/null || true
          test "$UNIT_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
