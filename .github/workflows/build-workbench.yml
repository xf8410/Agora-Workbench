name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply phase5 integration
        if: github.ref == 'refs/heads/workbench/root-fix-conversation-loss-v5-phase5-tests-scroll-anchor'
        run: |
          python3 scripts/apply_conversation_loss_v5_phase5.py
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/viewmodel/ChatViewModel.kt \
            app/src/main/java/com/newoether/agora/ui/chat/MessageList.kt
          git diff --cached --check
          git commit -m 'fix: preserve viewport while prepending tested history pages'
          git push origin HEAD:workbench/root-fix-conversation-loss-v5-phase5-tests-scroll-anchor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-conversation-loss-v5-phase5-${{ github.run_id }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
