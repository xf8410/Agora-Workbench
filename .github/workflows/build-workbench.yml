name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply final integration cleanup
        run: python3 scripts/finalize_main_integration.py
      - name: Validate cleaned integration tree
        run: |
          set -euo pipefail
          test ! -e ci-failure-summary.txt
          test ! -e .github/workflows/apply-conversation-loss-v5-phase1.yml
          test ! -e .github/workflows/integrate-client-resilience-once.yml
          test ! -e .github/workflows/register-github-clone-tool-once.yml
          test ! -e .github/workflows/finalize-main-integration-once.yml
          git diff --check
      - name: Commit cleaned integration tree
        run: |
          set -euo pipefail
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: enforce non-mutating main integration gate'
      - name: Push cleaned integration tree
        run: git push origin HEAD:workbench/fix-reply-disappears-on-next-send
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-final-integration-${{ github.run_id }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
