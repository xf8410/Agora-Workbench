# workbench/fix-red-build cannot start a second expensive APK build.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'This diagnostic branch is retired.'
          echo 'Use the Build Agora Workbench APK workflow on main.'
