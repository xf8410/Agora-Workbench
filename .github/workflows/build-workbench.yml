name: Build Agora Workbench APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest > unit-test.log 2>&1
          status=$?
          cat unit-test.log
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/ci-diagnostics
            cp unit-test.log docs/ci-diagnostics/unit-test.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/ci-diagnostics/unit-test.log
            git commit -m "保存单元测试原始诊断 [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
          exit "$status"
      - name: Build APK (verify main SHA compiles)
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
