name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: workbench-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Diagnose unit-test build
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          timeout --signal=TERM --kill-after=30s 12m \
            ./gradlew --no-daemon --console=plain --stacktrace testFdroidDebugUnitTest \
            2>&1 | tee ci-diagnostic.log

      - name: Commit diagnostic log
        if: always()
        shell: bash
        run: |
          test -f ci-diagnostic.log || echo 'Gradle did not start or checkout/setup failed before diagnostics.' > ci-diagnostic.log
          git config user.name 'Agora Workbench Bot'
          git config user.email 'actions@github.com'
          git add -f ci-diagnostic.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record Gradle diagnostic output'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Preserve failure status
        if: steps.diagnose.outcome == 'failure'
        run: exit 1
