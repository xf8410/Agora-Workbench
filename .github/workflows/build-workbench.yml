name: Build Agora Workbench APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest
      - name: Build APK (verify main SHA compiles)
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Stage verified APK
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          mkdir -p artifacts
          cp "$apk_path" "artifacts/Agora-Workbench-${GITHUB_SHA}.apk"
          test -s "artifacts/Agora-Workbench-${GITHUB_SHA}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-${{ github.sha }}-run${{ github.run_id }}
          path: artifacts/Agora-Workbench-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
