name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply reply preservation patch and verified documentation
        if: github.ref == 'refs/heads/workbench/fix-reply-disappears-on-next-send'
        run: |
          python3 scripts/apply_reply_disappears_fix.py
          python3 scripts/sync_verified_intro_to_root_readme.py
          if ! git diff --quiet; then
            git config user.name 'Agora Workbench Bot'
            git config user.email 'agora-workbench@users.noreply.github.com'
            git add app/src/main/java/com/newoether/agora/viewmodel/MessageGenerationController.kt README.md
            git diff --cached --check
            git commit -m 'docs: prepend verified fixes and preserve existing introduction'
            git push origin HEAD:workbench/fix-reply-disappears-on-next-send
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-reply-preservation-${{ github.run_id }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
