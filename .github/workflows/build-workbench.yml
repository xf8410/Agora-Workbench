name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Stage 3A tool timing once
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt")
          text = path.read_text()

          def replace_once(old, new):
              global text
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one Stage 3A source match, found {text.count(old)}")
              text = text.replace(old, new)

          replace_once(
              "import com.newoether.agora.model.ToolCallData\n",
              "import com.newoether.agora.model.ToolCallData\nimport com.newoether.agora.model.ToolExecutionPresentation\nimport com.newoether.agora.model.ToolExecutionStatus\n",
          )
          replace_once(
              '''        fun finishCurrentThoughtTiming() {
            val startedAt = currentThoughtStartMs ?: return
            val elapsed = System.currentTimeMillis() - startedAt
            if (elapsed > 0L) {
                cumulativeThoughtMs += elapsed
                currentThoughtDurationMs += elapsed
                totalThoughtTimeMs = cumulativeThoughtMs
            }
            currentThoughtStartMs = null
        }
''',
              '''        fun finishCurrentThoughtTiming() {
            val startedAt = currentThoughtStartMs ?: return
            val elapsed = System.currentTimeMillis() - startedAt
            if (elapsed > 0L) {
                cumulativeThoughtMs += elapsed
                currentThoughtDurationMs += elapsed
                totalThoughtTimeMs = cumulativeThoughtMs
            }
            currentThoughtStartMs = null
        }

        fun finishPendingTools(status: ToolExecutionStatus) {
            val finishedAt = System.currentTimeMillis()
            segments.indices.forEach { index ->
                val segment = segments[index]
                if (segment.type == "tool" && segment.toolResult == null &&
                    segment.toolStatus == ToolExecutionStatus.RUNNING
                ) {
                    segments[index] = segment.copy(
                        toolFinishedAtMs = finishedAt,
                        toolStatus = status,
                    )
                }
            }
        }
''',
          )
          replace_once(
              '''                        val ts = MessageSegment(type = "tool", toolName = event.name, toolArgs = event.arguments, toolResult = null, toolCallId = event.id, signature = event.signature)
                        appendMergedSegment(segments, ts)
''',
              '''                        val ts = MessageSegment(
                            type = "tool",
                            toolName = event.name,
                            toolArgs = event.arguments,
                            toolResult = null,
                            toolCallId = event.id,
                            signature = event.signature,
                            toolStartedAtMs = System.currentTimeMillis(),
                            toolStatus = ToolExecutionStatus.RUNNING,
                        )
                        appendMergedSegment(segments, ts)
''',
          )
          replace_once(
              '''                        if (idx >= 0) {
                            segments[idx] = segments[idx].copy(toolResult = clipped)
                            roundToolSegments.add(segments[idx])
                        }
''',
              '''                        if (idx >= 0) {
                            val finishedAt = System.currentTimeMillis()
                            val completed = segments[idx].copy(
                                toolResult = clipped,
                                toolFinishedAtMs = finishedAt,
                            )
                            segments[idx] = completed.copy(
                                toolStatus = ToolExecutionPresentation.status(
                                    completed,
                                    MessageStatus.SUCCESS,
                                ) ?: ToolExecutionStatus.SUCCESS,
                            )
                            roundToolSegments.add(segments[idx])
                        }
''',
          )
          replace_once(
              '''                        event.calls.forEach { call ->
                            appendMergedSegment(segments, MessageSegment(type = "tool", toolName = call.name, toolArgs = call.arguments, toolResult = null, toolCallId = call.id, signature = call.signature))
                        }
''',
              '''                        event.calls.forEach { call ->
                            appendMergedSegment(
                                segments,
                                MessageSegment(
                                    type = "tool",
                                    toolName = call.name,
                                    toolArgs = call.arguments,
                                    toolResult = null,
                                    toolCallId = call.id,
                                    signature = call.signature,
                                    toolStartedAtMs = System.currentTimeMillis(),
                                    toolStatus = ToolExecutionStatus.RUNNING,
                                ),
                            )
                        }
''',
          )
          replace_once(
              '''                            if (idx >= 0) {
                                segments[idx] = segments[idx].copy(toolResult = clipped)
                                roundToolSegments.add(segments[idx])
                            }
''',
              '''                            if (idx >= 0) {
                                val finishedAt = System.currentTimeMillis()
                                val completed = segments[idx].copy(
                                    toolResult = clipped,
                                    toolFinishedAtMs = finishedAt,
                                )
                                segments[idx] = completed.copy(
                                    toolStatus = ToolExecutionPresentation.status(
                                        completed,
                                        MessageStatus.SUCCESS,
                                    ) ?: ToolExecutionStatus.SUCCESS,
                                )
                                roundToolSegments.add(segments[idx])
                            }
''',
          )
          replace_once(
              '''        } catch (e: CancellationException) {
            currentStatus = MessageStatus.STOPPED
            throw e
        } catch (e: Exception) {
            val isCancelled = generationJob?.isCancelled == true
            currentStatus = if (isCancelled) MessageStatus.STOPPED else MessageStatus.ERROR
''',
              '''        } catch (e: CancellationException) {
            finishPendingTools(ToolExecutionStatus.STOPPED)
            currentStatus = MessageStatus.STOPPED
            throw e
        } catch (e: Exception) {
            val isCancelled = generationJob?.isCancelled == true
            finishPendingTools(
                if (isCancelled) ToolExecutionStatus.STOPPED else ToolExecutionStatus.INTERRUPTED,
            )
            currentStatus = if (isCancelled) MessageStatus.STOPPED else MessageStatus.ERROR
''',
          )

          path.write_text(text)
          PY
          if ! git diff --quiet -- app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
            git commit -m "Record terminal tool execution timing"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest 2>&1 | tee unit-test.log; then
            while IFS= read -r line; do
              echo "::error title=Unit test failure::$line"
            done < <(grep -E '(^e: |FAILED$|> Task .* FAILED|There were failing tests|Caused by:|AssertionError)' unit-test.log | tail -n 40)
            exit 1
          fi
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
