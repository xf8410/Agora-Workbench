name: Build Agora Workbench APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build proot native binaries
        run: bash build-proot.sh
      - name: Build F-Droid debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          APK=$(find app/build/outputs/apk/fdroid/debug -name '*.apk' | head -1)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          NOTES="Automated build from main branch.\n\nChanges:\n- Proot sandbox: CI builds native binaries\n- Update check removed\n- GitHub tool auth in system prompt\n- GitHub tools always visible\n- Version $TAG"
          gh release create "$TAG" "$APK" --title "Agora Workbench $TAG" --notes "$NOTES"
