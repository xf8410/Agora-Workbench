name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: workbench-main-apk
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Disable persistent release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f local.properties
          rm -rf "$RUNNER_TEMP/workbench-signing"
          echo 'Building the fdroidDebug variant; no release keystore is used.'

      - name: Build proot native binaries
        run: bash build-proot.sh

      - name: Test and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace \
            testFdroidDebugUnitTest assembleFdroidDebug 2>&1 | tee ci-main-build.log

      - name: Prepare APK files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/fdroid/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/Agora-Workbench-latest.apk
          sha256sum dist/Agora-Workbench-latest.apk | tee dist/Agora-Workbench-latest.apk.sha256
          version="$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs \
            dist/Agora-Workbench-latest.apk | tee dist/signature.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agora-Workbench-fdroid-debug
          path: |
            dist/Agora-Workbench-latest.apk
            dist/Agora-Workbench-latest.apk.sha256
            dist/signature.txt
            ci-main-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Create or update rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag='workbench-latest'
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Latest successful Agora Workbench fdroidDebug APK built from main.

          Version: $VERSION
          Commit: $HEAD_SHA
          Actions run: https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is a debug-signed recovery build. Uninstall any older Agora Workbench
          installation before installing it.
          Package: com.newoether.agora.workbench
          EOF

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPOSITORY" \
              --title 'Agora Workbench — Latest debug build' \
              --notes-file "$notes_file" --target "$HEAD_SHA" --latest
          else
            gh release create "$tag" --repo "$REPOSITORY" \
              --target "$HEAD_SHA" \
              --title 'Agora Workbench — Latest debug build' \
              --notes-file "$notes_file" --latest
          fi

          gh release upload "$tag" \
            dist/Agora-Workbench-latest.apk \
            dist/Agora-Workbench-latest.apk.sha256 \
            dist/signature.txt \
            --repo "$REPOSITORY" --clobber
