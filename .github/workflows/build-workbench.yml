name: Build Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply Stage 2 source changes once
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-stage2-token-layout-once.yml')
          text = workflow.read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          unlink = "Path('.github/workflows/apply-stage2-token-layout-once.yml').unlink()"
          if unlink not in script:
              raise SystemExit('Stage 2 applicator cleanup marker is missing')
          script = script.rsplit(unlink, 1)[0]
          compile(script, 'stage2-applicator', 'exec')
          exec(script)
          PY
          git diff --check
          git diff --stat
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/ui/chat/message/AssistantMessageContent.kt \
                  app/src/main/java/com/newoether/agora/ui/chat/message/AssistantActionVisibility.kt \
                  app/src/test/java/com/newoether/agora/ui/chat/message/AssistantActionVisibilityTest.kt \
                  app/src/main/res/values/strings.xml \
                  app/src/main/res/values-zh/strings.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Move per-reply token usage below assistant actions'
            git push origin HEAD:workbench/generation-ui-timeout-tools-20260818
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
