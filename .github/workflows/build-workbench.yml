name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: workbench-main-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Diagnose unit-test build
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest 2>&1 | tee ci-diagnostic.log

      - name: Commit diagnostic log after failure
        if: steps.diagnose.outcome == 'failure'
        shell: bash
        run: |
          git config user.name 'Agora Workbench Bot'
          git config user.email 'actions@github.com'
          git add -f ci-diagnostic.log
          git commit -m 'Record failing Gradle diagnostic'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail after saving diagnostic
        if: steps.diagnose.outcome == 'failure'
        run: exit 1

      - name: Unit tests passed
        run: echo 'Unit-test build passed; restore the release workflow after diagnosis.'
