name: Build Agora Workbench APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: agora-workbench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  BUILD_FILE: app/build.gradle.kts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply conversation-loss v5 phase2
        if: github.ref == 'refs/heads/workbench/root-fix-conversation-loss-v5-phase2'
        run: |
          python3 scripts/apply_conversation_loss_v5_phase2.py
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/ui/chat/ChatApp.kt app/src/main/java/com/newoether/agora/ui/chat/MessageList.kt
          git diff --cached --check
          git commit -m 'fix: remove reply whitespace and open conversations at latest reply'
          git push origin HEAD:workbench/root-fix-conversation-loss-v5-phase2
      - name: Verify checked-out identity
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Test and build F-Droid debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest assembleFdroidDebug
      - name: Prepare traceable APK and manifest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' "$BUILD_FILE" | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' "$BUILD_FILE" | head -n1)"
          build_sha="$(git rev-parse HEAD)"; short_sha="${build_sha:0:12}"
          source_apk="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"; mkdir -p release
          apk_name="Agora-Workbench-${version_name}-vc${version_code}-${short_sha}-run${GITHUB_RUN_ID}.apk"
          cp "$source_apk" "release/$apk_name"
          apk_sha256="$(sha256sum "release/$apk_name" | awk '{print $1}')"
          printf '%s  %s\n' "$apk_sha256" "$apk_name" > "release/$apk_name.sha256"
          echo "artifact_name=Agora-Workbench-${version_name}-${short_sha}-run${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
