name: Apply conversation cross-talk fix

on:
  push:
    branches:
      - workbench/fix-conversation-cross-talk

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-conversation-cross-talk
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          vm = "app/src/main/java/com/newoether/agora/viewmodel/ChatViewModel.kt"
          replace_once(vm, '''    fun createNewChat() {
              // Already on the new-chat screen: ignore (both the drawer and the top-bar capsule route
              // here; behaviour must be identical and a no-op when there's nothing to reset).
              if (_isNewChatMode.value) return
              switchingJob?.cancel()
              if (!_isNewChatMode.value) {
                  _pendingSystemPromptId.value = null
              }
              _isNewChatMode.value = true
              _isTransitioningToNewChat.value = true
              _isSwitching.value = true
              switchingJob = viewModelScope.launch {
                  kotlinx.coroutines.delay(SWITCH_OVERLAY_FADE_MS) // Allow overlay to fade in
                  _currentConversationId.value = null
                  _currentActiveModel.value = null
                  _pendingConversationSettings.value = null
                  _allMessages.value = emptyList()
                  _selectedChildren.value = emptyMap()
                  _branchSwitchTrigger.value = null
                  _isSwitching.value = false
                  _isTransitioningToNewChat.value = false
              }
          }
          ''', '''    fun createNewChat() {
              // Already on the new-chat screen: ignore (both the drawer and the top-bar capsule route
              // here; behaviour must be identical and a no-op when there's nothing to reset).
              if (_isNewChatMode.value) return
              switchingJob?.cancel()
              _pendingSystemPromptId.value = null
              _isNewChatMode.value = true
              _isTransitioningToNewChat.value = true
              _isSwitching.value = true

              // Conversation identity must change synchronously. Delaying this reset for the fade
              // animation allowed a fast first Send to create a conversation, after which the old
              // transition job cleared its id and visible tree, making the UI appear to cross-wire
              // the new message into another conversation.
              _currentConversationId.value = null
              _currentActiveModel.value = null
              _pendingConversationSettings.value = null
              _allMessages.value = emptyList()
              _selectedChildren.value = emptyMap()
              _branchSwitchTrigger.value = null

              // Only the cosmetic end of the transition is delayed.
              switchingJob = viewModelScope.launch {
                  kotlinx.coroutines.delay(SWITCH_OVERLAY_FADE_MS)
                  _isSwitching.value = false
                  _isTransitioningToNewChat.value = false
              }
          }
          ''')

          replace_once(vm, '''        
              viewModelScope.launch {
                  _selectedChildren.collect { childrenMap ->
                      val id = _currentConversationId.value
                      if (id != null) {
                          persistSelectedChildren(id, childrenMap)
                      }
                  }
              }
          }
          ''', '''        
          }
          ''')

          replace_once(vm, '''    fun switchBranch(parentId: String?, currentMessageId: String, direction: Int) {
              if (_isLoading.value && _generatingInConversationId.value == _currentConversationId.value) return
          ''', '''    fun switchBranch(parentId: String?, currentMessageId: String, direction: Int) {
              val conversationId = _currentConversationId.value ?: return
              if (_isLoading.value && _generatingInConversationId.value == conversationId) return
          ''')

          replace_once(vm, '''            newMap[parentId] = targetMessage.id
              _selectedChildren.value = newMap
              
              _branchSwitchTrigger.value = null
          ''', '''            newMap[parentId] = targetMessage.id
              // Persist against the id captured when the branch action began. Never re-read the
              // globally open id after the transition delay, or A's branch map can be written to B.
              persistSelectedChildren(conversationId, newMap)
              if (_currentConversationId.value != conversationId) {
                  _isSwitching.value = false
                  return@launch
              }
              _selectedChildren.value = newMap
              
              _branchSwitchTrigger.value = null
          ''')

          drawer = "app/src/main/java/com/newoether/agora/ui/chat/ChatDrawerContent.kt"
          replace_once(drawer, '''                    items(grouped.entries.toList()) { (convId, entries) ->
          ''', '''                    items(grouped.entries.toList(), key = { it.key }) { (convId, entries) ->
          ''')
          replace_once(drawer, '''                    items(conversations) { conversation ->
          ''', '''                    items(conversations, key = { it.id }) { conversation ->
          ''')

          db = "app/src/main/java/com/newoether/agora/data/local/ChatDatabase.kt"
          replace_once(db, '''    @Query("SELECT COUNT(*) FROM messages WHERE conversationId = :conversationId")
              fun getMessageCountForConversation(conversationId: String): Flow<Int>
          ''', '''    @Query("SELECT COUNT(*) FROM messages WHERE conversationId = :conversationId")
              fun getMessageCountForConversation(conversationId: String): Flow<Int>

              /** Complete tree snapshot for business operations. UI rendering remains windowed. */
              @Query("SELECT * FROM messages WHERE conversationId = :conversationId ORDER BY timestamp ASC")
              suspend fun getAllMessagesForConversation(conversationId: String): List<MessageEntity>
          ''')

          repo = "app/src/main/java/com/newoether/agora/data/repository/ConversationRepository.kt"
          replace_once(repo, '''    suspend fun getMessagesForConversationSnapshot(conversationId: String): List<MessageEntity> =
              chatDao.getMessagesForConversation(conversationId).first()
          ''', '''    /** Complete message tree used for parent/leaf resolution and mutations. */
              suspend fun getMessagesForConversationSnapshot(conversationId: String): List<MessageEntity> =
                  chatDao.getAllMessagesForConversation(conversationId)
          ''')

          Path(".github/workflows/apply-conversation-cross-talk-fix.yml").unlink()
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent conversation state cross-talk"
          git push origin HEAD:workbench/fix-conversation-cross-talk
