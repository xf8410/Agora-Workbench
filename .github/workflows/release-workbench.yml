name: Release Agora Workbench APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-workbench
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read authoritative source version
        id: version
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p release-logs
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest \
            2>&1 | tee release-logs/unit-test-console.log

      - name: Build debug-signed APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleFdroidDebug \
            2>&1 | tee release-logs/apk-build-console.log

      - name: Verify signature and prepare release assets
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee release-logs/signature.txt
          asset="Agora-Workbench-${VERSION_NAME}-arm64-v8a-debug-signed.apk"
          cp "$apk_path" "$asset"
          sha256sum "$asset" | tee "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          cat > release-manifest.json <<EOF
          {
            "version_name": "${VERSION_NAME}",
            "version_code": ${VERSION_CODE},
            "tag": "v${VERSION_NAME}",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "workflow_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "artifact": "${asset}"
          }
          EOF
          cat > "CHANGELOG-${VERSION_NAME}.md" <<EOF
          # Agora Workbench ${VERSION_NAME}

          - Version code: ${VERSION_CODE}
          - Commit: ${GITHUB_SHA}
          - Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - APK SHA-256: $(cut -d' ' -f1 "$asset.sha256")

          ## Changes
          EOF
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            git log --no-merges --pretty='- %s (`%h`)' "$previous_tag..$GITHUB_SHA" >> "CHANGELOG-${VERSION_NAME}.md"
          else
            git log -n 30 --no-merges --pretty='- %s (`%h`)' "$GITHUB_SHA" >> "CHANGELOG-${VERSION_NAME}.md"
          fi

      - name: Upload release logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}-${{ github.sha }}
          path: |
            release-logs/
            release-manifest.json
            CHANGELOG-*.md
            *.sha256
          if-no-files-found: warn
          retention-days: 90

      - name: Refuse to retarget an existing version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          fi
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points to $remote_sha, not $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Create tag when absent
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name 'Agora Workbench Bot'
            git config user.email 'agora-workbench@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $VERSION_NAME (code $VERSION_CODE)"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Agora Workbench ${{ steps.version.outputs.name }}
          body_path: CHANGELOG-${{ steps.version.outputs.name }}.md
          overwrite_files: true
          files: |
            ${{ steps.apk.outputs.asset }}
            ${{ steps.apk.outputs.asset }}.sha256
            release-manifest.json
            CHANGELOG-${{ steps.version.outputs.name }}.md
