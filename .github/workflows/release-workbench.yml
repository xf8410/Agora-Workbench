name: Release Agora Workbench APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: false
        default: '1.4.7-workbench'
      version_code:
        description: 'Version code'
        required: false
        default: '35'

permissions:
  contents: write

concurrency:
  group: release-workbench
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify on latest main SHA
        run: |
          echo "Building release from ${{ github.sha }}"
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest

      - name: Set version
        run: |
          set -euo pipefail
          test -n "${{ inputs.version_name }}"
          [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]
          sed -i "s/versionCode = .*/versionCode = ${{ inputs.version_code }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ inputs.version_name }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      # fdroidDebug is signed automatically with the runner-generated Android
      # debug key. It is installable, but a later build may require uninstalling
      # the previous APK because GitHub-hosted runners do not retain this key.
      - name: Build debug-signed APK
        run: ./gradlew --no-daemon --stacktrace assembleFdroidDebug

      - name: Verify signature and prepare release asset
        id: apk
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          test -s "$apk_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          asset="Agora-Workbench-${{ inputs.version_name }}-arm64-v8a-debug-signed.apk"
          cp "$apk_path" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create tag when absent
        env:
          TAG: v${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; keeping it and updating the release assets."
          else
            git config user.name 'Agora Workbench Bot'
            git config user.email 'agora-workbench@users.noreply.github.com'
            git tag -a "$TAG" -m "Release ${{ inputs.version_name }} (code ${{ inputs.version_code }})"
            git push origin "$TAG"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_name }}"
          name: "Agora Workbench ${{ inputs.version_name }}"
          generate_release_notes: true
          overwrite_files: true
          files: "${{ steps.apk.outputs.asset }}"
