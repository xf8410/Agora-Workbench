name: Wire workspace agent once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/wire-workspace-agent-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - run: python3 scripts/wire_workspace_agent.py
      - run: git rm scripts/wire_workspace_agent.py .github/workflows/wire-workspace-agent-once.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/di/AppContainer.kt \
                  app/src/main/java/com/newoether/agora/MainActivity.kt \
                  app/src/main/java/com/newoether/agora/automation/TaskExecutionEngine.kt
          git commit -m "feat(workspace): 让每条通道独立运行 GitHub Agent"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
