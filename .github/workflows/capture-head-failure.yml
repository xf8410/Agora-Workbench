name: Capture exact HEAD failure
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/capture-head-failure.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Run exact Kotlin unit task
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest 2>&1 | tee /tmp/unit.log
      - name: Persist exact failure, including failed-test XML
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "gradle_outcome=${{ steps.unit.outcome }}"
            echo "=== compiler and gradle failures ==="
            grep -E '^e: |^FAILURE:|^> Task .*FAILED|There were failing tests|AssertionError|ComparisonFailure|expected:|but was:|Caused by:' /tmp/unit.log || true
            echo "=== failed test reports ==="
            find app/build/test-results -type f -name '*.xml' -print0 2>/dev/null | xargs -0 grep -H -A12 -B3 '<failure' 2>/dev/null || true
            echo "=== final log tail ==="
            tail -n 160 /tmp/unit.log
          } > .github/ci-head-failure.log
          git rm .github/workflows/capture-head-failure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/ci-head-failure.log
          git commit -m "ci: 记录最终 Head 的精确 Kotlin 失败"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
