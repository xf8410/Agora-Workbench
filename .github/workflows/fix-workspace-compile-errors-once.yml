name: Fix workspace compile errors once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/fix-workspace-compile-errors-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - run: python3 scripts/fix_workspace_compile_errors.py
      - run: git rm scripts/fix_workspace_compile_errors.py .github/workflows/fix-workspace-compile-errors-once.yml .github/ci-current-unit-failure.log
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/workspace/WorkspaceAgentRunner.kt \
                  app/src/main/java/com/newoether/agora/ui/workspace/GitHubWorkspaceScreen.kt \
                  app/src/main/java/com/newoether/agora/tool/GitHubWorkspaceToolProvider.kt
          git commit -m "fix(workspace): 修复调度器与工具定义编译错误"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
