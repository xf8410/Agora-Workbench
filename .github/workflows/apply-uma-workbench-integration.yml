name: Legacy Uma integration source patch (disabled)

# Disabled to prevent a push-triggered patch from creating another main commit and racing
# the build/release workflow. Integration changes must be committed to source explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Disabled: use a reviewed workbench/* branch; do not patch or push main here."
          exit 1
