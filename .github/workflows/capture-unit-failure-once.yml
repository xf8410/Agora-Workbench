name: Capture unit failure once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/capture-unit-failure-once.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Run unit compilation and capture diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest 2>&1 | tee /tmp/unit.log
      - name: Persist exact compiler/test failures
        run: |
          { grep -E '^e: |FAILED|There were failing tests|AssertionError|expected:|but was:|Caused by:' /tmp/unit.log || tail -n 300 /tmp/unit.log; } > .github/ci-current-unit-failure.log
          git rm .github/workflows/capture-unit-failure-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/ci-current-unit-failure.log
          git commit -m "ci: 记录当前单测失败正文"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
