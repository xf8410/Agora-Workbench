name: Compact generation settings UI once
on:
  push:
    branches: [workbench/fork-upstream-pr-workspace]
    paths: [.github/workflows/compact-generation-settings-ui-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/fork-upstream-pr-workspace, fetch-depth: 0}
      - run: python3 scripts/compact_generation_settings_ui.py
      - run: git rm scripts/compact_generation_settings_ui.py scripts/wire_workspace_output_policy.py .github/workflows/compact-generation-settings-ui-once.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/ui/settings/SettingsGenerationPage.kt \
                  app/src/main/java/com/newoether/agora/ui/common/ThinkingControlPanel.kt \
                  app/src/main/java/com/newoether/agora/workspace/WorkspaceAgentRunner.kt
          git commit -m "fix(settings): 文档入口移至顶栏并压缩生成参数布局"
          git push origin HEAD:workbench/fork-upstream-pr-workspace
