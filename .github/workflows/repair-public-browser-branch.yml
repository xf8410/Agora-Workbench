name: Repair public browser branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/public-repository-browser
          fetch-depth: 0
      - name: Restore GenerationManager and wire confirmation
        run: |
          set -euxo pipefail
          git fetch origin main
          git show origin/main:app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt > /tmp/GenerationManager.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/GenerationManager.kt')
          s=p.read_text()
          old='    private val githubToolProvider = com.newoether.agora.tool.GitHubToolProvider(app)'
          new='''    private val githubToolProvider = com.newoether.agora.tool.GitHubToolProvider(app).also { provider ->
        provider.confirm = { summary -> onConfirmShellCommand?.invoke("GitHub", summary) ?: false }
    }'''
          if old not in s: raise SystemExit('provider marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          cp /tmp/GenerationManager.kt app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/viewmodel/GenerationManager.kt
          git commit -m 'fix: restore generation manager and confirm GitHub mutations'
          git push origin HEAD:workbench/public-repository-browser
