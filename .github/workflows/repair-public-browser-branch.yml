name: Permanently remove obsolete patch workflows

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete workflows from active branches
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'

          remove_from_branch() {
            branch="$1"
            echo "Cleaning $branch"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git rm --ignore-unmatch \
              .github/workflows/apply-separate-public-read.yml \
              .github/workflows/repair-public-browser-branch.yml \
              .github/workflows/validate-public-repository-browser.yml \
              .github/workflows/remove-obsolete-workflows.yml
            if git diff --cached --quiet; then
              echo "No obsolete workflows remain on $branch"
              return
            fi
            git commit -m 'chore: permanently remove obsolete one-shot workflows'
            git push origin "HEAD:$branch"
          }

          # Clean the feature branch first so merging it cannot resurrect the files.
          remove_from_branch workbench/fix-invisible-messages
          remove_from_branch main
