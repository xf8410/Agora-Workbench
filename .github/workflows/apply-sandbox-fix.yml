name: Apply sandbox download and storage fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Patch sandbox implementation
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/fdroid/java/com/newoether/agora/sandbox/ProotSandboxManager.kt')
          s = p.read_text()

          # Failed package downloads must never be treated as a valid cache entry.
          # Always download through a .part file and atomically replace the target.
          anchor = '    /** Download [url] to [dest], streaming SHA-256 + progress, then verify against [rootfsSha256]. */\n'
          helper = r'''    /**
     * Downloads a package/index to a temporary file and atomically publishes it.
     * A non-zero partial file is never reused. Transient CDN/mobile-network failures
     * are retried with backoff, and Content-Length is checked when available.
     */
    private fun downloadHttpFile(url: String, dest: File, attempts: Int = 3): Boolean {
        var lastFailure: Throwable? = null
        repeat(attempts.coerceAtLeast(1)) { attempt ->
            val part = File(dest.absolutePath + ".part")
            try {
                part.delete()
                val conn = URL(url).openConnection() as HttpURLConnection
                try {
                    conn.connectTimeout = 30_000
                    conn.readTimeout = 120_000
                    conn.instanceFollowRedirects = true
                    conn.setRequestProperty("Accept", "application/octet-stream")
                    conn.connect()
                    val code = conn.responseCode
                    if (code !in 200..299) error("HTTP $code from $url")
                    val expected = conn.contentLengthLong
                    var copied = 0L
                    conn.inputStream.use { input ->
                        part.outputStream().use { output ->
                            val buffer = ByteArray(64 * 1024)
                            while (true) {
                                val n = input.read(buffer)
                                if (n < 0) break
                                if (n == 0) continue
                                output.write(buffer, 0, n)
                                copied += n
                            }
                        }
                    }
                    if (copied == 0L || (expected > 0L && copied != expected)) {
                        error("incomplete download ($copied/$expected bytes)")
                    }
                } finally {
                    conn.disconnect()
                }
                if (!part.renameTo(dest)) {
                    dest.delete()
                    if (!part.renameTo(dest)) error("cannot publish downloaded file")
                }
                return true
            } catch (failure: Throwable) {
                lastFailure = failure
                part.delete()
                if (attempt + 1 < attempts) Thread.sleep((500L shl attempt).coerceAtMost(4_000L))
            }
        }
        lastError = "Download failed after $attempts attempts: ${lastFailure?.message ?: url}"
        return false
    }

'''
          if helper not in s:
              if anchor not in s:
                  raise SystemExit('downloadRootfs anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          # Replace both package download implementations (install and upgrade).
          old = '''                    val conn = URL("$alpineMirror/aarch64/$fn").openConnection() as HttpURLConnection
                    if (conn.responseCode != 200) { onProgress("HTTP ${conn.responseCode}"); lastError = "HTTP ${conn.responseCode}: $fn"; tmpDir.listFiles()?.forEach { it.delete() }; return@withContext false }
                    conn.inputStream.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
'''
          new = '''                    if (!downloadHttpFile("$alpineMirror/aarch64/$fn", f)) {
                        onProgress("FAIL: ${lastError ?: "download failed"}")
                        tmpDir.listFiles()?.forEach { it.delete() }
                        return@withContext false
                    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'install package block count was {s.count(old)}, expected 1')
          s = s.replace(old, new, 1)

          old2 = '''                    val conn = URL("$alpineMirror/aarch64/$fn").openConnection() as HttpURLConnection
                    if (conn.responseCode != 200) {
                        onProgress("HTTP ${conn.responseCode}")
                        lastError = "HTTP ${conn.responseCode}: $fn"
                        tmpDir.listFiles()?.forEach { it.delete() }
                        return@withContext 0
                    }
                    conn.inputStream.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
'''
          new2 = '''                    if (!downloadHttpFile("$alpineMirror/aarch64/$fn", f)) {
                        onProgress("FAIL: ${lastError ?: "download failed"}")
                        tmpDir.listFiles()?.forEach { it.delete() }
                        return@withContext 0
                    }
'''
          if s.count(old2) != 1:
              raise SystemExit(f'upgrade package block count was {s.count(old2)}, expected 1')
          s = s.replace(old2, new2, 1)

          # APKINDEX had the same missing timeout/retry problem; use the same safe publisher.
          old3 = '''            val conn = URL(indexUrl).openConnection() as HttpURLConnection
            onProgress("Connecting to ${conn.url.host}...")
            val code = conn.responseCode
            onProgress("HTTP $code (${conn.contentLength} bytes)")
            if (code != 200) { onProgress("FAIL: HTTP $code"); lastError = "HTTP $code from $indexUrl"; return@withContext false }
            conn.inputStream.use { i -> indexFile.outputStream().use { o -> i.copyTo(o) } }
'''
          new3 = '''            onProgress("Connecting to ${URL(indexUrl).host}...")
            if (!downloadHttpFile(indexUrl, indexFile)) {
                onProgress("FAIL: ${lastError ?: "package index download failed"}")
                return@withContext false
            }
            onProgress("Package index downloaded (${indexFile.length()} bytes)")
'''
          if s.count(old3) != 1:
              raise SystemExit(f'install index block count was {s.count(old3)}, expected 1')
          s = s.replace(old3, new3, 1)

          old4 = '''            val conn = URL(indexUrl).openConnection() as HttpURLConnection
            if (conn.responseCode != 200) { onProgress("HTTP ${conn.responseCode}"); lastError = "HTTP ${conn.responseCode} from $indexUrl"; return@withContext 0 }
            conn.inputStream.use { i -> indexFile.outputStream().use { o -> i.copyTo(o) } }
'''
          new4 = '''            if (!downloadHttpFile(indexUrl, indexFile)) {
                onProgress("FAIL: ${lastError ?: "package index download failed"}")
                return@withContext 0
            }
'''
          if s.count(old4) != 1:
              raise SystemExit(f'upgrade index block count was {s.count(old4)}, expected 1')
          s = s.replace(old4, new4, 1)
          p.write_text(s)

          # The 2 GiB denominator was only a visual cap, not real storage. Make the
          # dashboard indeterminate so it no longer falsely advertises a hard limit.
          q = Path('app/src/main/java/com/newoether/agora/ui/settings/SettingsSandboxPage.kt')
          t = q.read_text()
          old5 = '''                                            LinearProgressIndicator(
                                                progress = { (diskUsageMB.toFloat() / 2048f).coerceIn(0f, 1f) },
                                                modifier = Modifier.weight(0.3f).height(6.dp),
                                                trackColor = MaterialTheme.colorScheme.surfaceVariant
                                            )
'''
          new5 = '''                                            // Storage is not capped at 2 GiB. This is an
                                            // indeterminate usage indicator; the text below
                                            // reports actual bytes consumed by the sandbox.
                                            LinearProgressIndicator(
                                                modifier = Modifier.weight(0.3f).height(6.dp),
                                                trackColor = MaterialTheme.colorScheme.surfaceVariant
                                            )
'''
          if old5 not in t:
              raise SystemExit('sandbox progress block not found')
          q.write_text(t.replace(old5, new5, 1))

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/fdroid/java/com/newoether/agora/sandbox/ProotSandboxManager.kt app/src/main/java/com/newoether/agora/ui/settings/SettingsSandboxPage.kt
          git diff --cached --quiet || git commit -m 'fix(sandbox): retry package downloads and remove quota illusion'
          git push origin HEAD:${GITHUB_REF_NAME}
