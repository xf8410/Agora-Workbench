name: Apply separate public repository read
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/separate-public-repo-read
          submodules: recursive
          fetch-depth: 0
      - name: Separate logged-in operations from anonymous public reads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt')
          s=p.read_text()
          old='''        if (!client.isSignedIn()) return errorJson("GitHub is not signed in. Go to Settings → GitHub Workbench to sign in with a token or Device Flow.")
        val args = runCatching'''
          new='''        // Do not gate the whole provider on login: github_read_file supports anonymous
        // public repositories. All account listing and mutation calls still use authenticated
        // GitHubApiClient.request() and therefore continue to require login.
        val args = runCatching'''
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('global auth marker mismatch')
          s=s.replace(
              'Read a UTF-8 text file or list a directory in a GitHub repository.',
              'Read a UTF-8 text file or list a directory. Public repositories work without login; private repositories require the signed-in account.',
              1,
          )
          s=s.replace(
              '"ref" to string("Branch, tag, or commit. Defaults to main.")',
              '"ref" to string("Branch, tag, or commit. Empty means the repository default branch.")',
              1,
          )
          # Keep ref empty so GitHubApiClient can resolve repositories whose default is not main.
          s=s.replace(
              '"github_read_file" -> readFileOrDirectory(arg("repo"), arg("path"), arg("ref", "main"))',
              '"github_read_file" -> readFileOrDirectory(arg("repo"), arg("path"), arg("ref"))',
              1,
          )
          p.write_text(s)
          PY
          git config user.name 'Agora Workbench Bot'
          git config user.email 'agora-workbench@users.noreply.github.com'
          git add app/src/main/java/com/newoether/agora/github/GitHubApiClient.kt app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt
          git diff --cached --check
          git commit -m 'feat: read public repositories without GitHub login'
          git push origin HEAD:workbench/separate-public-repo-read
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build native dependencies
        run: bash build-proot.sh
      - name: Compile and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testFdroidDebugUnitTest assembleFdroidDebug
