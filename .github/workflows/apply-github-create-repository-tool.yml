name: Apply GitHub create repository tool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/github-create-repository-tool
      - name: Add bounded repository creation tool
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt')
          s=p.read_text()
          def once(old,new):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'expected one match, got {n}: {old!r}')
              s=s.replace(old,new,1)
          once('''        "github_list_repositories", "github_read_file", "github_create_branch",
                  "github_write_file", "github_get_workflow_runs", "github_dispatch_workflow",''','''        "github_list_repositories", "github_create_repository", "github_read_file", "github_create_branch",
                  "github_write_file", "github_get_workflow_runs", "github_dispatch_workflow",''')
          once('''            tool("github_list_repositories", "List repositories accessible to the signed-in GitHub account.", emptyMap()),
                      tool("github_read_file",''','''            tool("github_list_repositories", "List repositories accessible to the signed-in GitHub account.", emptyMap()),
                      tool("github_create_repository", "Create a repository owned by the signed-in GitHub user. Defaults to private and initializes main with a README.", mapOf(
                          "name" to string("Repository name, 1-100 characters. Do not include an owner or slash."),
                          "description" to string("Optional repository description."),
                          "private" to ToolProperty("boolean", "Whether the repository is private. Defaults to true."),
                          "auto_init" to ToolProperty("boolean", "Initialize the repository with a README and main branch. Defaults to true."),
                      ), listOf("name")),
                      tool("github_read_file",''')
          once('''        fun arg(key: String, default: String = "") = (args[key] as? JsonPrimitive)?.content ?: default
                  return runCatching {''','''        fun arg(key: String, default: String = "") = (args[key] as? JsonPrimitive)?.content ?: default
                  fun boolArg(key: String, default: Boolean) = (args[key] as? JsonPrimitive)?.content?.toBooleanStrictOrNull() ?: default
                  return runCatching {''')
          once('''                "github_list_repositories" -> listRepositories()
                          "github_read_file"''','''                "github_list_repositories" -> listRepositories()
                          "github_create_repository" -> createRepository(
                              arg("name"), arg("description"), boolArg("private", true), boolArg("auto_init", true)
                          )
                          "github_read_file"''')
          once('''    private suspend fun listRepositories(): String {''','''    private suspend fun createRepository(name: String, description: String, privateRepo: Boolean, autoInit: Boolean): String {
                  require(name.matches(Regex("[A-Za-z0-9._-]{1,100}"))) { "Repository name must be 1-100 characters using letters, numbers, dot, underscore, or hyphen" }
                  val response = client.request("POST", "/user/repos", buildJsonObject {
                      put("name", name)
                      if (description.isNotBlank()) put("description", description.take(350))
                      put("private", privateRepo)
                      put("auto_init", autoInit)
                  })
                  if (response.code !in 200..299) error("GitHub returned HTTP ${response.code}: ${response.body.take(300)}")
                  val obj = json.parseToJsonElement(response.body).jsonObject
                  return buildJsonObject {
                      put("ok", true)
                      put("full_name", obj.string("full_name"))
                      put("private", obj.string("private").toBooleanStrictOrNull() ?: privateRepo)
                      put("default_branch", obj.string("default_branch", "main"))
                      put("html_url", obj.string("html_url"))
                  }.toString()
              }

              private suspend fun listRepositories(): String {''')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/newoether/agora/tool/GitHubToolProvider.kt
          git commit -m 'feat: add private GitHub repository creation tool'
          git push origin HEAD:workbench/github-create-repository-tool
